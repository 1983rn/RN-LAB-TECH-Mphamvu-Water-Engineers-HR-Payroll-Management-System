{% extends "base.html" %}

{% block title %}Add Client - MPHAMVU WATER ENGINEERS{% endblock %}

{% block extra_css %}
<style>
    body {
        background-image: url("{{ url_for('static', filename='images/pure_water_bg.png') }}") !important;
        background-size: cover !important;
        background-attachment: fixed !important;
    }

    .main-wrapper,
    .main-content {
        background: transparent !important;
    }

    h2 {
        color: #0d47a1 !important;
        font-weight: 800;
        text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.25) !important;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.4) !important;
        border-radius: 25px !important;
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15) !important;
        padding: 30px;
    }

    .form-label {
        font-weight: 700;
        color: #052c65;
        margin-bottom: 8px;
    }

    .form-control, .form-select {
        background: rgba(255, 255, 255, 0.5) !important;
        border: 1px solid rgba(13, 71, 161, 0.2) !important;
        border-radius: 12px !important;
        padding: 12px 15px;
        color: #052c65;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        background: rgba(255, 255, 255, 0.8) !important;
        border-color: #0d47a1 !important;
        box-shadow: 0 0 0 0.25rem rgba(13, 71, 161, 0.1) !important;
    }

    .btn-save {
        background: linear-gradient(135deg, #0d47a1 0%, #0077cc 100%);
        border: none;
        border-radius: 12px;
        padding: 12px 30px;
        font-weight: 700;
        transition: all 0.3s ease;
    }

    .btn-save:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(13, 71, 161, 0.3);
    }
</style>
{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-12 py-3">
        <div class="d-flex justify-content-between align-items-center">
            <h2><i class="fas fa-user-plus me-2"></i>Register New Client</h2>
            <a href="{{ url_for('clients.list_clients') }}" class="btn btn-outline-primary border-2 fw-bold">
                <i class="fas fa-arrow-left me-2"></i>Back to Directory
            </a>
        </div>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card glass-card">
            <form method="POST">
                <div class="row">
                    <div class="col-md-12 mb-4">
                        <label for="client_name" class="form-label">Client Name / Company *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3"><i class="fas fa-building text-primary"></i></span>
                            <input type="text" class="form-control border-start-0 rounded-end-pill" id="client_name" name="client_name" placeholder="Enter name or business entity" required>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label for="phone" class="form-label">Phone Number *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3"><i class="fas fa-phone text-primary"></i></span>
                            <input type="tel" class="form-control border-start-0 rounded-end-pill" id="phone" name="phone" placeholder="+265..." required>
                        </div>
                    </div>
                    <div class="col-md-6 mb-4">
                        <label for="email" class="form-label">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3"><i class="fas fa-envelope text-primary"></i></span>
                            <input type="email" class="form-control border-start-0 rounded-end-pill" id="email" name="email" placeholder="client@example.com">
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-4">
                        <label for="project_type" class="form-label">Primary Project Type *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0 rounded-start-pill ps-3"><i class="fas fa-tint text-primary"></i></span>
                            <select class="form-select border-start-0 rounded-end-pill" id="project_type" name="project_type" required>
                                <option value="" selected disabled>Select primary service</option>
                                <option value="Borehole Drilling">Borehole Drilling</option>
                                <option value="Water Reticulation">Water Reticulation</option>
                                <option value="Irrigation System">Irrigation System</option>
                                <option value="Pump Installation">Pump Installation</option>
                                <option value="Solar Water System">Solar Water System</option>
                                <option value="General Maintenance">General Maintenance</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-12 mb-4">
                        <label for="address" class="form-label">Physical / Business Address *</label>
                        <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter full address" required></textarea>
                    </div>
                </div>

                <div class="text-end mt-4">
                    <button type="reset" class="btn btn-light me-2 rounded-pill px-4">Clear Form</button>
                    <button type="submit" class="btn btn-primary btn-save rounded-pill px-5 text-white">
                        <i class="fas fa-save me-2"></i>Save Client Record
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
