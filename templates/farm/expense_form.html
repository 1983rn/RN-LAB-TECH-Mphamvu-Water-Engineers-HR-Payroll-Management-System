{% extends "base.html" %}

{% block title %}Record Farm Expense - MWE{% endblock %}

{% block content %}
<div class="row justify-content-center fade-in">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom">
                <h5 class="mb-0 fw-bold">
                    <i class="fas fa-file-invoice-dollar me-2 text-danger"></i> Record Farm Expense
                </h5>
                <a href="{{ url_for('farm.view_activity', activity_id=activity.id) }}" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-arrow-left me-1"></i> Back to Activity
                </a>
            </div>
            
            <div class="bg-light px-4 py-2 border-bottom">
                <span class="text-muted small fw-bold">ACTIVITY:</span>
                <span class="text-dark fw-bold ms-2">{{ activity.activity_name }}</span>
            </div>

            <div class="card-body p-4">
                <form method="POST">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="category" class="form-label fw-bold">Expense Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="" selected disabled>Select Category</option>
                                <option value="Labor (Casual/Permanent)">Labor (Casual/Permanent)</option>
                                <option value="Land Preparation/Tractor Hire">Land Prep / Tractor Hire</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Input Purchase (Direct)">Input Purchase (Direct via Expenses)</option>
                                <option value="Irrigation/Water Bills">Irrigation / Water</option>
                                <option value="Maintenance/Repairs">Maintenance / Repairs</option>
                                <option value="Marketing/Packaging">Marketing / Packaging</option>
                                <option value="Miscellaneous">Miscellaneous</option>
                            </select>
                        </div>
                        <div class="col-md-6 mt-3 mt-md-0">
                            <label for="expense_date" class="form-label fw-bold">Date of Expense <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="expense_date" name="expense_date" required value="{{ request.form.get('expense_date', '') }}">
                            <div class="form-text text-muted">Leave blank to use today's date if unsupported.</div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="amount" class="form-label fw-bold">Total Expense Amount (MWK) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted border-end-0">MWK</span>
                            <input type="number" step="0.01" class="form-control border-start-0 text-danger fw-bold" id="amount" name="amount" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="description" class="form-label fw-bold">Description / Notes</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="e.g. Paid 10 workers for weeding, bought diesel for generator..."></textarea>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger py-2 text-uppercase fw-bold shadow-sm">
                            <i class="fas fa-save me-2"></i> Save Expense Record
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Set today's date as default
    document.addEventListener('DOMContentLoaded', function() {
        var dateField = document.getElementById('expense_date');
        if (!dateField.value) {
            var today = new Date();
            var yyyy = today.getFullYear();
            var mm = String(today.getMonth() + 1).padStart(2, '0');
            var dd = String(today.getDate()).padStart(2, '0');
            dateField.value = yyyy + '-' + mm + '-' + dd;
        }
    });
</script>
{% endblock %}
