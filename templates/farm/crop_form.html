{% extends "base.html" %}

{% block title %}New Planting - MWE Farm{% endblock %}

{% block extra_css %}
<style>
    body {
        background: url("{{ url_for('static', filename='images/Sunny farm life with goats and corn.png') }}") no-repeat center center fixed;
        background-size: cover;
    }
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: -1;
    }
    .form-glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        color: white;
        max-width: 800px;
        margin: 40px auto;
    }
    .form-control, .form-select {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
    }
    .form-control:focus, .form-select:focus {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border-color: #28a745;
        box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);
    }
    label {
        font-weight: 600;
        margin-bottom: 8px;
        color: #d4edda;
    }
    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }
</style>
{% endblock %}

{% block content %}
<div class="form-glass fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-seedling me-2"></i>New Crop Planting</h2>
        <a href="{{ url_for('farm.dashboard') }}" class="btn btn-outline-light btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>

    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="crop_name">Crop Name</label>
                <input type="text" class="form-control" id="crop_name" name="crop_name" required placeholder="e.g. Corn, Soybeans">
            </div>
            <div class="col-md-6">
                <label for="variety">Variety</label>
                <input type="text" class="form-control" id="variety" name="variety" placeholder="e.g. MH18, SC719">
            </div>
            <div class="col-md-6">
                <label for="planting_date">Planting Date</label>
                <input type="date" class="form-control" id="planting_date" name="planting_date" required value="{{ now.strftime('%Y-%m-%d') }}">
            </div>
            <div class="col-md-6">
                <label for="expected_harvest_date">Expected Harvest Date</label>
                <input type="date" class="form-control" id="expected_harvest_date" name="expected_harvest_date">
            </div>
            <div class="col-12">
                <label for="notes">Notes (Field location, Fertilizer used, etc.)</label>
                <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
            </div>
        </div>

        <div class="mt-4 pt-3 border-top border-light">
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                <i class="fas fa-seedling me-2"></i> Record Planting
            </button>
        </div>
    </form>
</div>
{% endblock %}
