{% extends "base.html" %}

{% block title %}Add Farm Input - MWE Farm{% endblock %}

{% block extra_css %}
<style>
    body {
        background: url("{{ url_for('static', filename='images/Sunny farm life with goats and corn.png') }}") no-repeat center center fixed;
        background-size: cover;
    }
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: -1;
    }
    .form-glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        color: white;
        max-width: 800px;
        margin: 40px auto;
    }
    .form-control, .form-select {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
    }
    .form-control:focus, .form-select:focus {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border-color: #28a745;
    }
    label { font-weight: 600; color: #d4edda; }
</style>
{% endblock %}

{% block content %}
<div class="form-glass fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-boxes me-2"></i>Add Farm Input Stock</h2>
        <a href="{{ url_for('farm.dashboard') }}" class="btn btn-outline-light btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Back
        </a>
    </div>

    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="item_name">Item Name</label>
                <input type="text" class="form-control" id="item_name" name="item_name" required placeholder="e.g. Maize Seed, Layer Mash">
            </div>
            <div class="col-md-6">
                <label for="category">Category</label>
                <select class="form-select" id="category" name="category" required>
                    <option value="" disabled selected>Select Category...</option>
                    <option value="Feed">Feed</option>
                    <option value="Medicine">Medicine</option>
                    <option value="Fertilizer">Fertilizer</option>
                    <option value="Seeds">Seeds</option>
                    <option value="Pesticides">Pesticides</option>
                    <option value="Tools">Tools</option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="quantity">Quantity</label>
                <input type="number" step="0.1" class="form-control" id="quantity" name="quantity" required placeholder="0.0">
            </div>
            <div class="col-md-4">
                <label for="unit">Unit</label>
                <input type="text" class="form-control" id="unit" name="unit" required placeholder="e.g. Bags, Kgs, Liters">
            </div>
            <div class="col-md-4">
                <label for="unit_price">Unit Price (MWK)</label>
                <input type="number" step="0.01" class="form-control" id="unit_price" name="unit_price" required placeholder="0.00">
            </div>
        </div>

        <div class="mt-4 pt-3 border-top border-light">
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                <i class="fas fa-plus-circle me-1"></i> Add to Stock & Record Expense
            </button>
        </div>
    </form>
</div>
{% endblock %}
