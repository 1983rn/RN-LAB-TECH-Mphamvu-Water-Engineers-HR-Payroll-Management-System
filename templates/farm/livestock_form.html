{% extends "base.html" %}

{% block title %}{{ 'Edit' if animal else 'Add' }} Livestock - MWE Farm{% endblock %}

{% block extra_css %}
<style>
    body {
        background: url("{{ url_for('static', filename='images/Sunny farm life with goats and corn.png') }}") no-repeat center center fixed;
        background-size: cover;
    }
    body::before {
        content: "";
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: -1;
    }
    .form-glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        color: white;
        max-width: 800px;
        margin: 40px auto;
    }
    .form-control, .form-select {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: white;
    }
    .form-control:focus, .form-select:focus {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border-color: #28a745;
        box-shadow: 0 0 0 0.25rem rgba(40, 167, 69, 0.25);
    }
    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }
    option {
        background: #1e4d2b;
        color: white;
    }
    label {
        font-weight: 600;
        margin-bottom: 8px;
        color: #d4edda;
    }
</style>
{% endblock %}

{% block content %}
<div class="form-glass fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fas fa-paw me-2"></i>{{ 'Edit' if animal else 'Add New' }} Livestock</h2>
        <a href="{{ url_for('farm.dashboard') }}" class="btn btn-outline-light btn-sm">
            <i class="fas fa-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>

    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label for="animal_type">Animal Type</label>
                <select class="form-select" id="animal_type" name="animal_type" required>
                    <option value="" disabled {{ 'selected' if not animal }}>Select Type...</option>
                    <option value="Goat" {{ 'selected' if animal and animal.animal_type == 'Goat' }}>Goat</option>
                    <option value="Pig" {{ 'selected' if animal and animal.animal_type == 'Pig' }}>Pig</option>
                    <option value="Cow" {{ 'selected' if animal and animal.animal_type == 'Cow' }}>Cow</option>
                    <option value="Sheep" {{ 'selected' if animal and animal.animal_type == 'Sheep' }}>Sheep</option>
                    <option value="Poultry" {{ 'selected' if animal and animal.animal_type == 'Poultry' }}>Poultry</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="tag_number">Tag / ID Number</label>
                <input type="text" class="form-control" id="tag_number" name="tag_number" value="{{ animal.tag_number if animal else '' }}" placeholder="e.g. MWE-G-001">
            </div>
            <div class="col-md-4">
                <label for="gender">Gender</label>
                <select class="form-select" id="gender" name="gender">
                    <option value="Male" {{ 'selected' if animal and animal.gender == 'Male' }}>Male</option>
                    <option value="Female" {{ 'selected' if animal and animal.gender == 'Female' }}>Female</option>
                </select>
            </div>
            <div class="col-md-8">
                <label for="breed">Breed</label>
                <input type="text" class="form-control" id="breed" name="breed" value="{{ animal.breed if animal else '' }}" placeholder="e.g. Boer, Large White">
            </div>
            <div class="col-md-6">
                <label for="birth_date">Birth Date</label>
                <input type="date" class="form-control" id="birth_date" name="birth_date" value="{{ animal.birth_date if animal else '' }}">
            </div>
            <div class="col-md-6">
                <label for="purchase_price">Purchase Price (MWK)</label>
                <input type="number" step="0.01" class="form-control" id="purchase_price" name="purchase_price" value="{{ animal.purchase_price if animal else '0' }}">
            </div>
            <div class="col-12">
                <label for="notes">Special Notes / Records</label>
                <textarea class="form-control" id="notes" name="notes" rows="3">{{ animal.notes if animal else '' }}</textarea>
            </div>
        </div>

        <div class="mt-4 pt-3 border-top border-light">
            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                <i class="fas fa-save me-2"></i> Save Livestock Record
            </button>
        </div>
    </form>
</div>
{% endblock %}
