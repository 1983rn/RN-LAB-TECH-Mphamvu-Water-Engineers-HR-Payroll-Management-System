{% if not quotation_gps_map_assets_included %}
{% set quotation_gps_map_assets_included = true %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
.quotation-gps-map-wrap { position: relative; overflow: hidden; background: #e9ecef; }
.quotation-gps-map-canvas { width: 100%; height: 420px; min-height: 320px; }
.quotation-gps-map-wrap.quotation-gps-map--hd .quotation-gps-map-canvas { height: 560px; min-height: 480px; }
.quotation-gps-capture-label {
    position: absolute; bottom: 10px; left: 10px; right: 10px; z-index: 1000;
    background: rgba(0, 0, 0, 0.78); color: #fff; padding: 8px 12px; border-radius: 6px;
    font-size: 13px; font-weight: 600; pointer-events: none; text-align: center;
}
.quotation-gps-map-wrap .leaflet-control-layers { font-size: 12px; }
</style>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="{{ url_for('static', filename='js/html2canvas.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/quotation_gps_map.js') }}"></script>
{% endif %}
